<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中地理教材 · 必修第一册 / 第二册</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="目录">☰</button>
  <div class="brand">
    <span class="brand-main">高中地理</span>
    <span class="brand-sub">人教版 · 必修第一册 / 第二册</span>
  </div>
  <div class="search-wrap">
    <input type="search" id="search" placeholder="搜索章节或正文内容…" autocomplete="off">
    <div class="search-results" id="searchResults" hidden></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav id="tree"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="content" id="content">
    <div class="placeholder" id="placeholder">
      <h1>高中地理电子教材</h1>
      <p>左侧选择「册 → 章 → 节」开始阅读。支持全文搜索、原书页面插图对照。</p>
      <p class="hint">内容抽离自《人教版高中地理 必修 第一册 / 第二册》两本教材，共 2 册、11 章、57 个章节节点。</p>
    </div>
  </main>
</div>

<script src="data/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
